# Compose on top of the exact upstream revision in upstream.lock.json.
defaults:
  - ppo_trainer
  - _self_

raise_method:
  method: raise
  # top_freq: the group's M most-frequently-failed checks, each hinted to K/M
  # rollouts as its own advantage subgroup. self: every rollout is hinted with the
  # checks IT violated and regenerates once, all K sharing one advantage group.
  guidance_mode: top_freq
  max_guidance_checks: 4

data:
  train_files: ${oc.env:RAISE_DATA}/train.parquet
  val_files: ${oc.env:RAISE_DATA}/dev.parquet
  train_batch_size: 16
  max_prompt_length: 4096
  max_response_length: 1024
  filter_overlong_prompts: false
  truncation: error
  shuffle: true
  seed: 42
  dataloader_num_workers: 2
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: ${oc.env:RAISE_MODEL}
    external_lib: raise_method.register
    use_remove_padding: false
    enable_gradient_checkpointing: true
    use_fused_kernels: false
    lora_rank: 32
    lora_alpha: 64
    lora:
      # Qwen3.5 in_proj_qkv adapters cannot be hot-loaded by vLLM 0.18.1.
      # compat.py snapshots merged weights before restoring the actor base.
      merge: true
    target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, out_proj, gate_proj, up_proj, down_proj]
    exclude_modules: '.*visual.*'
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    loss_agg_mode: token-mean
    policy_loss:
      loss_mode: raise_clip
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    use_torch_compile: false
    freeze_vision_tower: true
    optim:
      lr: 1.0e-5
      lr_scheduler_type: constant
      lr_warmup_steps: 0
      weight_decay: 0.0
    fsdp_config:
      strategy: fsdp2
      model_dtype: bfloat16
      dtype: bfloat16
      fsdp_size: 4
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      use_torch_compile: false
      ulysses_sequence_parallel_size: 1
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    use_torch_compile: false
    fsdp_config:
      strategy: fsdp2
      model_dtype: bfloat16
      use_torch_compile: false
      param_offload: false
  rollout:
    name: vllm
    mode: async
    agent:
      agent_loop_manager_class: raise_method.rollout.RaiseAgentLoopManager
    n: 8
    temperature: 0.9
    top_p: 1.0
    top_k: -1
    engine_kwargs:
      vllm:
        seed: 42
    tensor_model_parallel_size: 4
    gpu_memory_utilization: 0.55
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    enable_prefix_caching: false
    enforce_eager: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      n: 1
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: -1

algorithm:
  adv_estimator: raise_grpo
  use_kl_in_reward: false
  rollout_correction: null

reward:
  num_workers: 8
  custom_reward_function:
    path: ${oc.env:RAISE_ROOT}/src/raise_method/reward.py
    name: compute_score

trainer:
  project_name: raise
  experiment_name: ${oc.env:RAISE_RUN}
  default_local_dir: ${oc.env:RAISE_ROOT}/checkpoints/${oc.env:RAISE_RUN}
  rollout_data_dir: ${oc.env:RAISE_ROOT}/runs/${oc.env:RAISE_RUN}/rollouts
  logger: [console]
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 2
  total_training_steps: null
  val_before_train: true
  test_freq: 16
  save_freq: 16
  resume_mode: disable
  balance_batch: true
